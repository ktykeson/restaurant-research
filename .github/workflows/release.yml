name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & publish macOS DMG
    runs-on: macos-14   # arm64, free for public repos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sanity-check VERSION matches tag
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver="$(tr -d '[:space:]' < VERSION)"
          echo "Tag: $tag"
          echo "VERSION: $ver"
          if [[ "$tag" != "$ver" ]]; then
            echo "::error::Git tag v$tag does not match VERSION file ($ver). Bump VERSION before tagging."
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .app + .dmg
        run: ./build.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RestaurantResearch.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
