<header class="view-header">
    <h2>Runs
        <button type="button" class="help-btn" data-tutorial-replay="runs"
                aria-label="Replay tutorial" title="Show tutorial">?</button>
    </h2>
    <p class="sub">Every crawl that's been started — what it cost, what it found, whether it finished. Re-export CSVs for past runs.</p>
</header>

<div class="runs-controls">
    <div class="segmented" role="tablist" aria-label="Status filter">
        <label><input type="radio" name="runs-status" value="all" checked><span>All</span></label>
        <label><input type="radio" name="runs-status" value="done"><span>Done</span></label>
        <label><input type="radio" name="runs-status" value="running"><span>Running</span></label>
        <label><input type="radio" name="runs-status" value="budget_exceeded"><span>Over budget</span></label>
        <label><input type="radio" name="runs-status" value="user_cancelled"><span>Cancelled</span></label>
    </div>
    <button id="runs-refresh" type="button" class="btn-secondary">Refresh</button>
    <span class="muted small"><span id="runs-total">0</span> runs</span>
</div>

<section class="runs-table-wrap">
    <table class="runs-table">
        <thead>
        <tr>
            <th>Started</th>
            <th>Regions</th>
            <th>Status</th>
            <th class="num">Cells</th>
            <th class="num">Requests</th>
            <th class="num">Cost</th>
            <th class="num">Leads</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="runs-body"></tbody>
    </table>
    <div id="runs-empty" class="empty-state" hidden>No runs match — start one from the Search view.</div>
</section>
