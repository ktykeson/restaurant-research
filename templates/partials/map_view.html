<div class="map-header">
    <h2>Map
        <button type="button" class="help-btn" data-tutorial-replay="map"
                aria-label="Replay tutorial" title="Show tutorial">?</button>
    </h2>
    <span id="map-count" class="map-count">loading…</span>
    <div class="map-filters" role="group" aria-label="Filter markers by reason">
        <button type="button" class="map-filter active" data-filter="all">All</button>
        <button type="button" class="map-filter" data-filter="no_website">No website</button>
        <button type="button" class="map-filter" data-filter="social_only">Social only</button>
    </div>
    <button type="button" id="map-reload" class="map-reload">Reload</button>
</div>
<div class="map-wrap">
    <div id="leads-map"></div>
    <div class="map-legend">
        <div class="map-legend-row"><span class="legend-dot no_website"></span> No website</div>
        <div class="map-legend-row"><span class="legend-dot social_only"></span> Social only</div>
    </div>
</div>
