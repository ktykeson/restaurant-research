<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restaurant Research — No-Website Lead Finder</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/search-view.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/map-view.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/runs-view.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cost-view.css') }}">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css">
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js" defer></script>
</head>
<body>
<div class="app-shell">
    {% include 'partials/sidebar.html' %}

    <main class="main">
        <section data-view="search">
            {% include 'partials/search_view.html' %}
        </section>

        <section data-view="map" hidden>
            {% include 'partials/map_view.html' %}
        </section>

        <section data-view="runs" hidden>
            {% include 'partials/runs_view.html' %}
        </section>

        <section data-view="cost" hidden>
            {% include 'partials/cost_view.html' %}
        </section>
    </main>
</div>

<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
